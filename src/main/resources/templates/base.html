<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="ISO-8859-1">
<title>Amar Dokan | Online Grocery Shop</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
	integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<!-- Start Navbar  -->
	<nav class="navbar navbar-expand-lg fixed-top navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="/"><i class="fa-solid fa-store fa-lg me-2"></i>Amar Dokan</a>
			<button class="navbar-toggler border-0 shadow-none" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<th:block th:if="${user==null}">
						<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
					</th:block>

					<th:block th:unless="${user==null}">
						<li class="nav-item" th:if="${user.role=='ROLE_ADMIN'}"><a
							class="nav-link" href="/admin/">Dashboard</a></li>

						<li class="nav-item" th:if="${user.role=='ROLE_USER'}"><a
							class="nav-link" href="/">Home</a></li>
					</th:block>

					<li class="nav-item"><a class="nav-link" href="/products">Products</a></li>

					<li class="nav-item dropdown"><a
						class="nav-link dropdown-toggle" href="#" role="button"
						data-bs-toggle="dropdown" aria-expanded="false">Categories</a>
						<ul class="dropdown-menu">
							<li th:each="c:${categorys}"><a class="dropdown-item"
								th:href="@{'/products?category='+${c.name}}">[[${c.name}]]</a></li>
						</ul>
					</li>
				</ul>

				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<th:block th:if="${user==null}">
						<li class="nav-item"><a class="nav-link" href="/signin">
							<i class="fa-solid fa-right-to-bracket me-1"></i>LOGIN</a></li>
						<li class="nav-item"><a class="nav-link" href="/register">REGISTER</a></li>
					</th:block>

					<th:block th:if="${user!=null}">
						<li class="nav-item" th:if="${user.role=='ROLE_USER'}">
							<a class="nav-link position-relative" href="/user/cart">
								<i class="fa-solid fa-cart-shopping"></i>
								<span class="badge rounded-pill bg-danger" th:if="${countCart > 0}">[[${countCart}]]</span>
								<span th:unless="${countCart > 0}">Cart</span>
							</a>
						</li>
						
						<li class="nav-item dropdown"><a
							class="nav-link dropdown-toggle" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false">
							<i class="fa-solid fa-circle-user fa-lg me-1"></i>[[${user.name}]]
						</a>
							<ul class="dropdown-menu dropdown-menu-end">
								<li><a class="dropdown-item" th:href="${user.role=='ROLE_ADMIN' ? '/admin/profile' : '/user/profile'}">
									<i class="fa-solid fa-address-card me-2"></i>Profile</a></li>
								<li th:if="${user.role=='ROLE_USER'}"><a
									class="dropdown-item" href="/user/user-orders">
									<i class="fa-solid fa-box-open me-2"></i>My Orders</a></li>
								<li><hr class="dropdown-divider"></li>
								<li><a class="dropdown-item text-danger" href="/logout">
									<i class="fa-solid fa-power-off me-2"></i>Logout</a></li>
							</ul>
						</li>
					</th:block>
				</ul>
			</div>
		</div>
	</nav>
	<!-- End Navbar -->

	<main th:replace="${content}"></main>

	<!-- Start Footer -->
	<footer class="footer text-center mt-auto">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<h5 class="fw-bold mb-3">Amar Dokan</h5>
					<p class="text-white-50 small mb-0">&copy; 2026 Amar Dokan. All rights reserved.</p>
				</div>
			</div>
		</div>
	</footer>
	<!-- End Footer  -->

	<!-- Jquery Validation Library  -->
	<script
		src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.js"></script>
	<script type="text/javascript" th:src="@{/js/script.js}"></script>
	<!-- End  -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</body>
</html>
