<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Edit Category</title>
</head>
<body>
	<section>
		<div class="container page-shell">
			<div class="page-header">
				<div>
					<p class="page-title">Edit Category</p>
					<p class="page-subtitle">Update the category details without changing the underlying workflow.</p>
				</div>
				<a href="/admin/category" class="back-link"><i class="fa-solid fa-arrow-left"></i>Back to Categories</a>
			</div>
			<div class="row justify-content-center">
				<div class="col-lg-5 col-md-8">
					<div class="card card-sh section-card">
						<div class="card-header text-center">
							<p class="section-title">Category Information</p>
							<div class="flash-stack mt-2">
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							</div>
						</div>
						<div class="card-body">
							<form action="/admin/updateCategory" method="post"
								enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${category.id}">
								<div class="mb-3">
									<label class="form-label">Enter Category</label> <input type="text" name="name"
										th:value="${category.name}" class="form-control">
								</div>

								<div class="mb-3">
									<label class="form-label">Status</label>

									<div class="form-check">
										<input class="form-check-input" type="radio"
											th:checked="${category.isActive==true}" value="true"
											name="isActive" id="flexRadioDefault1"> <label
											class="form-check-label" for="flexRadioDefault1">
											Active </label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											th:checked="${category.isActive==false}" value="false"
											id="flexRadioDefault2"> <label
											class="form-check-label" for="flexRadioDefault2">
											Inactive </label>
									</div>

								</div>

								<div class="mb-3">
									<label class="form-label">Upload Image</label> <input type="file" name="file"
										class="form-control">
								</div>
								<img th:src="${#strings.startsWith(category.imageName, 'http')} ? ${category.imageName} : @{'/img/category_img/' + ${category.imageName}}"
									class="media-thumb media-thumb-lg mb-3" alt="Category preview">
								<button class="btn btn-primary w-100 mt-2">Update</button>
							</form>
						</div>
					</div>
				</div>



			</div>
		</div>
	</section>
</body>
</html>
