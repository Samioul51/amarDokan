<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
<meta charset="ISO-8859-1">
<title>Add Product</title>
</head>

<body>
	<section>
		<div class="container page-shell">
			<div class="page-header">
				<div>
					<p class="page-title">Add Product</p>
					<p class="page-subtitle">Create a new product entry with the same existing save flow.</p>
				</div>
				<a href="/admin/" class="back-link"><i class="fa-solid fa-arrow-left"></i>Dashboard</a>
			</div>
			<div class="row justify-content-center">
				<div class="col-lg-7">
					<div class="card card-sh section-card">
						<div class="card-header text-center">
							<p class="section-title">Product Details</p>
							<div class="flash-stack mt-2">

							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							</div>
						</div>
						<div class="card-body">
							<p id="msg" class="fw-bold"></p>
							<form id="productForm" method="post" enctype="multipart/form-data">
								<div class="mb-3">
									<label class="form-label">Enter Title</label> <input type="text" name="title" class="form-control"
										required>
								</div>

								<div class="mb-3">
									<label class="form-label">Enter Description</label>
									<textarea rows="3" cols="" class="form-control" name="description"
										required></textarea>
								</div>

								<div class="mb-3">
									<label class="form-label">Category</label> <select class="form-select" name="category.id" required>
										<option value="">--select--</option>
										<option th:each="c:${categories}" th:value="${c.id}">[[${c.name}]]</option>
									</select>
								</div>

								<div class="mb-3">
									<label class="form-label">Enter Price</label> <input type="number" name="price" class="form-control"
										required>
								</div>
								<div class="mb-3">
									<label class="form-label">Status</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" checked value="true"
											name="isActive" id="flexRadioDefault1">
										<label class="form-check-label" for="flexRadioDefault1">
											Active </label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive" value="false"
											id="flexRadioDefault2"> <label class="form-check-label"
											for="flexRadioDefault2">
											Inactive </label>
									</div>

								</div>
								<div class="row">

									<div class="mb-3 col">
										<label class="form-label">Enter Stock</label> <input type="number" name="stock"
											class="form-control" required>
									</div>

									<div class="mb-3 col">
										<label class="form-label">Upload Image</label> <input type="file" name="file" class="form-control"
											required>
									</div>
								</div>
								<button type="submit" class="btn btn-primary w-100">Submit</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>


</html>
