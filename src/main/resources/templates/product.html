<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="content-wrap page-shell">
		<div class="shop-banner p-4 mb-4">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<form action="/products" method="get">
						<div class="input-group">
							<input type="text" class="form-control" name="ch" placeholder="Search for products">
							<button class="btn btn-light text-dark ms-0 ms-md-3 mt-3 mt-md-0">
								<i class="fa-solid fa-magnifying-glass"></i> Search
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>


		<div class="row g-4 shop-layout">

				<div class="col-lg-3">

					<div class="card card-sh section-card filter-card sticky-panel">
						<div class="card-body">
							<div class="list-group">
								<p class="section-title mb-3">Category</p>
								<a href="/products"
									th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item list-group-item-action"
									aria-current="true"> All </a> <a th:each="c:${categories}"
									th:href="@{'/products?category='+${c.name}}"
									th:classappend="${paramValue == c.name} ? 'active':''"
									class="list-group-item list-group-item-action">[[${c.name}]]</a>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-9">
					<div class="card card-sh section-card product-list-card">
						<div class="card-body">
							<div class="page-header mb-4">
								<div>
									<p class="page-title">Products</p>
									<p class="page-subtitle">Browse the available collection with the current filters.</p>
								</div>
							</div>
							<div class="row product-grid">

								<th:block th:if="${productsSize >0}">
									<div class="col-6 col-md-4 col-xl-3" th:each="p:${products}">
										<div class="card card-sh product-card product-item-card">
											<div class="card-body text-center">
												<img th:src="${p.image != null and #strings.startsWith(p.image, 'http')} ? ${p.image} : @{'/img/product_img/' + ${p.image}}"
													class="product-item-image" alt="Product image">
												<p class="fs-5 text-center mb-2">[[${p.title}]]</p>
												<div class="text-center mt-auto">
													<p class="fs-6 fw-bold price-stack">
														<span><th:block th:utext="${@commnServiceImpl.takaSign()}"></th:block> [[${p.discountPrice}]]</span> <br> <span
															class="text-decoration-line-through text-secondary"><th:block th:utext="${@commnServiceImpl.takaSign()}"></th:block>
															[[${p.price}]]</span> <span class="fs-6 text-success">[[${p.discount}]]%
															off </span>
													</p>
													<a th:href="@{'/product/'+${p.id}}"
														class="btn btn-primary w-100">View
														Details</a>
												</div>
											</div>
										</div>
									</div>
								</th:block>
								<th:block th:unless="${productsSize>0}">
									<p class="fs-4 text-center mt-4 text-danger">Product not
										available</p>
								</th:block>
							</div>
							<div class="pagination-panel">
								<div class="row align-items-center g-3">
									<div class="col-12 col-md-4">Total Products : [[${totalElements}]]</div>
									<div class="col-12 col-md-8">
										<th:block th:if="${productsSize>0}">
											<nav aria-label="Page navigation example">
												<ul class="pagination justify-content-md-end mb-0">
													<li class="page-item"
														th:classappend="${isFirst} ? 'disabled':''"><a
														class="page-link"
														th:href="@{'/products?pageNo='+${pageNo-1}}"
														aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
													</a></li>

													<li th:each="i:${#numbers.sequence(1,totalPages)}"
														class="page-item" th:classappend="${pageNo+1==i}?'active':''"><a class="page-link"
														th:href="@{'/products?pageNo='+${i-1}}">[[${i}]]</a></li>

													<li class="page-item"
														th:classappend="${isLast} ? 'disabled':''"><a
														class="page-link"
														th:href="@{'/products?pageNo='+${pageNo+1}}"
														aria-label="Next"> <span aria-hidden="true">&raquo;</span>
													</a></li>
												</ul>
											</nav>
										</th:block>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		</div>

	</section>
</body>
</html>
